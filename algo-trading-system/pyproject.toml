[project]
name = "algo-trading-system"
version = "0.1.0"
description = "Production-grade modular algo trading platform"
requires-python = ">=3.11"

dependencies = [
    "pandas>=2.2.0",
    "numpy>=2.0.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.10.0",
    "python-dotenv>=1.1.0",
    "websockets>=15.0",
    "httpx>=0.28.0",
    "structlog>=25.4.0",
    "PyYAML>=6.0.2",
    "SQLAlchemy>=2.0.41",
    "aiosqlite>=0.21.0",
    "ta>=0.11.0",
    "pandas-ta>=0.3.14b0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=6.1.0",
    "black>=25.1.0",
    "ruff>=0.11.0",
    "mypy>=1.16.0",
    "pre-commit>=4.2.0",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true